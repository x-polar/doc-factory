<!-- KORI Answers HERO v5 — G-level flow (v0.1 D24)

     Children placed INSIDE their planes (iso u,v math). Amber security band
     crosses Gateway→Agent→Tools; its tag tilted along the plane edge. -->
<div class="dg-canvas">

  <!-- ══ Background planes (z0) — all anchored at top:1.3in ══ -->
  <!-- G3 Inference Serving -->
  <div class="dg-iso-plane" style="left:5.15in; top:1.3in; width:2.1in; height:1.5in;
       --iso-tint:#D5D5D5; z-index:0;"></div>
  <div class="dg-iso-zonetag" style="left:3.95in; top:2.05in; --iso-tint:#8A8A8A;">INFERENCE SERVING</div>

  <!-- G4 Tool Layer -->
  <div class="dg-iso-plane" style="left:7.55in; top:1.3in; width:1.7in; height:1.7in;
       --iso-tint:#2E9E86; z-index:0;"></div>
  <div class="dg-iso-zonetag" style="left:7.55in; top:3.08in; --iso-tint:#2E9E86;">TOOL LAYER</div>

  <!-- G5 Data Layer -->
  <div class="dg-iso-plane" style="left:10.6in; top:1.3in; width:2.0in; height:1.9in;
       --iso-tint:#6FE9CE; z-index:0;"></div>

       style="left:6.6in; top:1.0in; width:2.7in; height:5.9in; z-index:1;"></div>
  <div class="dg-iso-zonetag" style="left:3.01in; top:3.93in; border-radius:0; --iso-tint:var(--kori-xcut);
       transform:matrix(0.866,0.5,-0.866,0.5,0,0); transform-origin:0 0;">DETERMINISTIC SECURITY</div>

  <!-- ══ Flow edges (thin) ══ -->
  <svg class="dg-edges" viewBox="0 0 1190 540" preserveAspectRatio="none">
    <defs>
      <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#22FFBD"/>
      </marker>
    </defs>
    <!-- User → G1 → G2 -->
    <path class="e e--accent" d="M100 338 H218" marker-end="url(#ah)"/>
    <path class="e e--accent" d="M298 348 H438" marker-end="url(#ah)"/>
    <!-- G2 ↕ G3 (Model Gateway front face) -->
    <path class="e e--accent" d="M528 342 L549 316" marker-end="url(#ah)"/>
    <path class="e" d="M566 320 L546 346"/>
    <!-- G2 → G4 (tools) -->
    <path class="e e--accent" d="M568 372 H705 V220 H738" marker-end="url(#ah)"/>
    <!-- G4 → G5 -->
    <path class="e e--accent" d="M852 216 H1002" marker-end="url(#ah)"/>
    <!-- G6 ⇢ G5 (dashed, pipe → data plane bottom vertex) -->
    <path class="e e--flow" d="M1044 420 L1056 342" marker-end="url(#ah)"/>
  </svg>

  <!-- ══ Components ══ -->

  <!-- C1 End User — person icon -->
  <div style="position:absolute; left:0.55in; top:3.08in; width:0.4in; height:0.5in; z-index:2;
              color:var(--c-accent);">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="6.5" r="3.5"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/>
    </svg>
  </div>
  <div style="position:absolute; left:0.75in; top:3.75in; transform:translateX(-50%); z-index:2;
              font-size:8pt; font-weight:600; color:var(--c-text); white-space:nowrap;">End User</div>

  <!-- G1 Compliance Gateway -->
  <div class="dg-iso-box dg-iso-box--muted dg-iso-box--mid" style="left:2.55in; top:3.25in; --sx:0.6in; --sy:0.6in; z-index:2;">
    <div class="f-top"><div class="dg-glyph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V8M19 21V8M2.5 8h19M4.5 4.5h15"/></svg>
    </div></div><div class="f-left"></div><div class="f-right"></div>

  <div class="dg-iso-callout" style="left:2.55in; top:2.4in;">

  </div>

  <!-- G2 Agent Core — hero mint block -->
  <div class="dg-iso-box dg-iso-box--hero dg-iso-box--mid" style="left:5.05in; top:3.52in; --sx:0.72in; --sy:0.72in; z-index:2;">

  </div>
  <div class="dg-iso-leader" style="left:5.05in; top:3.52in; --len:0.42in;"></div>
  <div class="dg-iso-callout dg-iso-callout--accent" style="left:5.05in; top:3.1in; transform:translate(-100%,-100%); border-left:none; border-right:1px solid color-mix(in srgb, var(--c-text) 45%, transparent); padding:0 0.07in 0.03in 0; text-align:right;">
    <div class="co-t">Agent Core</div>
  </div>

  <!-- G3 children INSIDE plane: LLM/SLM behind (upper), Model Gateway front -->
  <div class="dg-iso-box dg-iso-slab" style="left:5.32in; top:1.99in; --sx:0.36in; --sy:0.36in; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>

  <div class="dg-iso-box dg-iso-slab" style="left:5.32in; top:1.75in; --sx:0.36in; --sy:0.36in; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div style="position:absolute; left:4.78in; top:1.8in; z-index:3; font-size:7pt; font-weight:600;

  <div class="dg-iso-box dg-iso-slab" style="left:6.1in; top:2.32in; --sx:0.27in; --sy:0.27in; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>

  <div style="position:absolute; left:6.42in; top:2.24in; z-index:3; font-size:7pt; font-weight:600;
              color:color-mix(in srgb, var(--c-text) 75%, transparent); white-space:nowrap;">SLM</div>
  <div class="dg-iso-box dg-iso-box--gateway" style="left:5.54in; top:2.28in; --sx:0.55in; --sy:0.55in; --h:0.26in; z-index:2;">
    <div class="f-top"></div><div class="f-left"></div><div class="f-right"></div>
  </div>
  <div class="dg-iso-leader" style="left:5.54in; top:2.28in; --len:1.2in;"></div>
  <div class="dg-iso-callout" style="left:5.54in; top:1.08in;">
    <div class="co-t">Model Gateway</div>
  </div>

  <!-- G4 children INSIDE plane: 3 tool cubes -->
  <div class="dg-iso-cube" style="left:7.81in; top:1.92in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-cube" style="left:7.42in; top:2.14in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-cube" style="left:8.2in; top:2.14in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-leader" style="left:7.81in; top:1.92in; --len:0.8in;"></div>
  <div class="dg-iso-callout" style="left:7.81in; top:1.12in;">
    <div class="co-t">Tools</div>
  </div>

  <!-- G5 children INSIDE plane: 4 cylinders + dictionary -->
  <div class="dg-iso-cyl" style="left:10.45in; top:1.8in; --d:0.46in; --h:0.22in; z-index:2;"><div class="cyl-top"></div><div class="cyl-body"></div></div>
  <div class="dg-iso-cyl" style="left:11.05in; top:2.0in; --d:0.46in; --h:0.22in; z-index:2;"><div class="cyl-top"></div><div class="cyl-body"></div></div>

  <div class="dg-iso-cyl" style="left:10.75in; top:2.3in; --d:0.46in; --h:0.22in; z-index:2;"><div class="cyl-top"></div><div class="cyl-body"></div></div>
  <div class="dg-iso-cyl" style="left:11.45in; top:2.5in; --d:0.38in; --h:0.16in; --iso-c:#B5A46A; z-index:2;"><div class="cyl-top"></div><div class="cyl-body"></div></div>
  <div class="dg-iso-leader" style="left:10.68in; top:1.83in; --len:0.75in;"></div>
  <div class="dg-iso-callout" style="left:10.68in; top:1.08in;">
    <div class="co-t">Stores</div>

  <!-- G6 Ingestion — pipe cylinder laid on iso axis -->
  <div style="position:absolute; left:8.15in; top:5.42in; width:2.6in; height:0.34in; z-index:2;
              transform:rotate(-26.57deg); transform-origin:0 50%;">
    <div style="position:absolute; inset:0; border-radius:0.17in / 50%;
                background:linear-gradient(180deg,
                  color-mix(in srgb, var(--kori-duct) 38%, var(--c-background)),
                  color-mix(in srgb, var(--kori-duct) 78%, #000 10%));
                border:1px solid color-mix(in srgb, var(--kori-duct) 60%, #000 12%);"></div>
    <div style="position:absolute; left:0; top:0; width:0.17in; height:0.34in;
                border-radius:50%;
                background:color-mix(in srgb, var(--kori-duct) 88%, #000 20%);
                border:1px solid color-mix(in srgb, var(--kori-duct) 60%, #000 12%);"></div>
    <div style="position:absolute; left:0.35in; top:50%; width:1.9in; height:0;
                border-top:2px dashed color-mix(in srgb, #fff 50%, var(--kori-duct));"></div>

  <div class="dg-iso-callout" style="left:7.7in; top:5.78in; transform:none; padding-left:0.09in;">
    <div class="co-t">Ingestion Pipeline</div>
