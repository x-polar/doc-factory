  <div class="dg-iso-plane" style="left:5.15in; top:1.3in; width:2.1in; height:1.5in;

  <div class="dg-iso-zonetag" style="left:4.35in; top:5.0in; border-radius:0; --iso-tint:var(--kori-xcut);

    <path class="e e--accent" d="M770 255 L855 295 L940 256"/>

    <path class="e e--flow" d="M792 371 L1019 402 V325"/>

    <div class="co-t">Model Gateway</div>

  <div class="dg-iso-cube" style="left:7.55in; top:1.95in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-cube" style="left:7.16in; top:2.17in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-cube" style="left:7.94in; top:2.17in; --s:0.3in; --h:0.16in; --iso-c:#2E9E86; z-index:2;"><div class="f-top"></div><div class="f-left"></div><div class="f-right"></div></div>
  <div class="dg-iso-leader" style="left:7.55in; top:1.95in; --len:0.83in;"></div>
